name: Scalp City - Deep RL historical pilot
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Single crypto research pupil
        type: choice
        options: [BTC/USD, ETH/USD, SOL/USD, XRP/USD, ADA/USD, AVAX/USD, LINK/USD, DOGE/USD, LTC/USD, BCH/USD]
        default: BTC/USD
      episodes:
        description: Historical replay episodes (1-50)
        type: number
        default: 5
permissions:
  contents: read
jobs:
  dqn-research-only:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install numpy 'torch>=2.3,<3'
      - name: Checker - verify self-directed pilot safeguards
        run: python -m unittest rl.test_dqn_experiment -v
      - name: Run one isolated DQN research experiment (no brokerage)
        shell: bash
        env:
          SYMBOL: ${{ inputs.symbol }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          python -m rl.dqn_experiment --symbol "$SYMBOL" --episodes "$EPISODES" --outdir dqn-artifacts
      - name: Store training-only results
        uses: actions/upload-artifact@v4
        with:
          name: dqn-development-only
          path: dqn-artifacts/
          retention-days: 14
          if-no-files-found: error
