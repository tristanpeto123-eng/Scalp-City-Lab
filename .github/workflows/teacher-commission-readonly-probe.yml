# Temporary one-shot read-only credential probe. No order writes.
name: Teacher Alpaca PAPER credential check (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teacher-commission-readonly-probe.yml'
permissions:
  contents: read
jobs:
  read-only-paper-check:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect configured PAPER account with GET only
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import {CryptoTeacherBroker} from './teacher/alpaca-crypto.mjs';
          import {preflightPaper} from './teacher/paper-preflight.mjs';
          const key=process.env.ALPACA_PAPER_KEY,secret=process.env.ALPACA_PAPER_SECRET;
          if(!key||!secret){
            console.log('PAPER_PREFLIGHT_STATUS=MISSING_GITHUB_PAPER_SECRETS');
            process.exit(1);
          }
          const symbol='BTC/USD';
          const broker=new CryptoTeacherBroker({
            credentials:{[symbol]:{key,secret}},
            fetchImpl:(url,options)=>{
              if(options?.method!=='GET'||!url.startsWith('https://paper-api.alpaca.markets/'))
                throw Error('SECURITY: blocked non-GET or non-PAPER broker request');
              return fetch(url,options);
            }
          });
          const outcome=await preflightPaper({broker,symbols:[symbol]});
          const row=outcome.rows[0];
          console.log('PAPER_PREFLIGHT_STATUS='+ (outcome.allPassed?'PASSED':'FAILED'));
          console.log('PAPER_PAIR='+row.symbol);
          console.log('REASONS='+JSON.stringify(row.reasons));
          console.log('ACCOUNT_STATUS='+row.status);
          console.log('ACCOUNT_ID_REDACTED=true');
          console.log('PAPER_ORDERS_SUBMITTED=0');
          if(!outcome.allPassed)process.exit(2);
          NODE
