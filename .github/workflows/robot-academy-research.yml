name: Refresh Robot Academy from persisted Scalp City training
on:
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - robot-academy-research.trigger
permissions:
  contents: write
concurrency:
  group: scalp-academy-training-publish
  cancel-in-progress: false
jobs:
  export-research:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout approved stable source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker - exporter tests before trusted research read
        run: |
          node --check scripts/export-robot-academy.mjs
          node --test scripts/export-robot-academy-tests.mjs
          node --test robot-academy-tests.mjs
      - name: Fetch persisted pair-local research history
        uses: actions/checkout@v4
        with:
          ref: scalp-learning-memory
          path: .academy-source
          persist-credentials: false
      - name: Export historical research data, not forward evidence
        run: node scripts/export-robot-academy.mjs .academy-source/scalp-learning/history.json research-data/robot-academy.json
      - name: Commit new history snapshot without modifying the ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research-data/robot-academy.json
          if git diff --cached --quiet; then
            echo 'No new history; published Academy remains unchanged'
          else
            git commit -m 'research: publish training-only Robot Academy pupil snapshots'
            git push origin HEAD:main
          fi
