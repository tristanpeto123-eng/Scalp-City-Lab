name: PDCA P3 - Teacher lineage without admissions
on:
  pull_request:
    paths:
      - 'scripts/export-robot-academy.mjs'
      - 'scripts/export-robot-academy-tests.mjs'
      - 'scripts/teacher-lineage-diagnostics*'
      - '.github/workflows/pdca-p3-teacher-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p3-checker:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      TEACHER_PAPER_ENABLED: 'false'
      TEACHER_ENABLE_EXAMINER: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: scalp-learning-memory
          path: research-memory
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject unaudited research lineage, verify no broker authority
        run: |
          node --check scripts/teacher-lineage-diagnostics.mjs
          node --test scripts/teacher-lineage-diagnostics-tests.mjs scripts/export-robot-academy-tests.mjs
          node --test teacher/teacher-tests.mjs teacher/teacher-v2-tests.mjs
      - name: Diagnose actual accepted candidates without bypassing Teacher
        run: |
          node scripts/teacher-lineage-diagnostics.mjs \
            research-memory/scalp-learning/history.json \
            validation-data \
            artifacts/teacher-lineage-diagnostics.json
      - uses: actions/upload-artifact@v4
        with:
          name: pdca-p3-teacher-lineage-diagnostics
          path: artifacts/teacher-lineage-diagnostics.json
          retention-days: 14
