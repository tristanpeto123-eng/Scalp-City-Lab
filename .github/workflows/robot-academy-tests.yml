name: Robot Academy grading and demo checks
on:
  push:
    branches: [feat/robot-academy-graduation-v1, release/robot-academy-v1, feat/robot-academy-real-history-v1, feat/robot-academy-repeated-training-v1, release/robot-training-half-hour-v1, main]
    paths:
      - robot-academy.html
      - robot-academy-tests.mjs
      - scripts/export-robot-academy.mjs
      - scripts/export-robot-academy-tests.mjs
      - scripts/run-robot-training.mjs
      - scripts/run-robot-training-tests.mjs
      - scripts/refresh-alpaca-snapshots.mjs
      - scripts/refresh-alpaca-snapshots-tests.mjs
      - robot-training.trigger
      - .github/workflows/robot-research-training.yml
      - .github/workflows/robot-academy-sync.yml
      - robot-academy-schema.json
      - ROBOT_ACADEMY.md
      - strategy-validation.html
      - .github/workflows/robot-academy-tests.yml
  pull_request:
    branches: [main]
    paths:
      - robot-academy.html
      - robot-academy-tests.mjs
      - scripts/export-robot-academy.mjs
      - scripts/export-robot-academy-tests.mjs
      - scripts/run-robot-training.mjs
      - scripts/run-robot-training-tests.mjs
      - scripts/refresh-alpaca-snapshots.mjs
      - scripts/refresh-alpaca-snapshots-tests.mjs
      - robot-training.trigger
      - .github/workflows/robot-research-training.yml
      - .github/workflows/robot-academy-sync.yml
      - robot-academy-schema.json
      - ROBOT_ACADEMY.md
      - strategy-validation.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grade thresholds, sample controls and no-fake-trading requirements
        run: |
          node --test robot-academy-tests.mjs
          node --check scripts/export-robot-academy.mjs
          node --test scripts/export-robot-academy-tests.mjs
          node --check scripts/run-robot-training.mjs
          node --test scripts/run-robot-training-tests.mjs
          node --test scripts/refresh-alpaca-snapshots-tests.mjs
