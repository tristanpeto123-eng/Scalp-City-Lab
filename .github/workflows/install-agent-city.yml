name: Scalp City Lab — Install 3D Agent City
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-city:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble 3D agent city in Lab only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "tristanpeto123-eng/Scalp-City-Lab" ]]; then
            echo 'Refusing installation outside Lab' >&2
            exit 1
          fi
          if [[ -f agent-city.js && -f tests/agent-city.test.mjs && -f agent-city-bridge.js ]]; then
            echo 'Agent City already installed; retaining future edits'
            node --check --input-type=module < agent-city.js
            node --test tests/agent-city.test.mjs
            exit 0
