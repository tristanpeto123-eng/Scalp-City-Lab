name: PDCA P0 - research memory recovery review
on:
  pull_request:
    paths:
      - 'scripts/run-robot-training.mjs'
      - 'scripts/run-robot-training-tests.mjs'
      - '.github/workflows/pdca-p0-memory-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-checker:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEACHER_PAPER_ENABLED: 'false'
      SCALP_PAPER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parsing and full research memory recovery regression
        run: |
          node --check scripts/run-robot-training.mjs
          node --test scripts/run-robot-training-tests.mjs
          node --test scripts/historical-training-folds-tests.mjs
          node --test scripts/robot-rewards-tests.mjs
      - name: Reject broker execution commands in this review workflow
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const workflow=fs.readFileSync('.github/workflows/pdca-p0-memory-recovery.yml','utf8');
          if (/permissions:\s*\n\s*contents: write/.test(workflow))
            throw Error('P0 workflow must remain read-only');
          console.log('P0_CHECKER_PASS: regression-only, no authenticated memory writes or broker orders');
          NODE
