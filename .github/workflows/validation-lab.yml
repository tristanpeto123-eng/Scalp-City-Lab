name: Scalp City — Run Historical Validation Lab
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Crypto chart / pair'
        required: true
        type: choice
        options: ['BTC/USD','ETH/USD','SOL/USD','XRP/USD','ADA/USD','AVAX/USD','LINK/USD','DOGE/USD','LTC/USD','BCH/USD']
        default: 'BTC/USD'
      starting_balance_gbp:
        description: 'VIRTUAL starting balance in GBP (minimum 50)'
        required: true
        type: string
        default: '50'
      mode:
        description: 'Stop when the duration finishes OR cumulative net-profit target is reached'
        required: true
        type: choice
        options: ['DURATION','PROFIT']
        default: 'DURATION'
      duration_days:
        description: 'If DURATION, number of simulated calendar days (1–219)'
        type: string
        default: '30'
      cumulative_profit_target_gbp:
        description: 'If PROFIT, net closed-trade GBP profit to accumulate'
        type: string
        default: '2000'
      history_days:
        description: 'Days of authenticated historical market data (30–365); duration requires sufficient unseen bars'
        type: choice
        options: ['90','180','365']
        default: '180'
      feed:
        description: 'Alpaca crypto venue: us-1 Kraken or us consolidated'
        type: choice
        options: ['us-1','us']
        default: 'us-1'
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frozen strategy runner and virtual ledger
        run: |
          node paper-runtime/validation-lab-tests.mjs
          node paper-runtime/profit-goal-tests.mjs
      - name: Use market GET-only historical bars (no deposits or orders)
        env:
          SCALP_TEST_SYMBOL: ${{ inputs.symbol }}
          SCALP_START_GBP: ${{ inputs.starting_balance_gbp }}
          SCALP_TEST_MODE: ${{ inputs.mode }}
          SCALP_DURATION_DAYS: ${{ inputs.duration_days }}
          SCALP_TARGET_PROFIT_GBP: ${{ inputs.cumulative_profit_target_gbp }}
          SCALP_HISTORY_DAYS: ${{ inputs.history_days }}
          SCALP_TEST_FEED: ${{ inputs.feed }}
          SCALP_VALIDATION_OUTPUT: 'validation-output/report.json'
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node paper-runtime/validation-run.mjs
      - name: Save verifiable JSON results for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-virtual-validation
          path: validation-output/report.json
          retention-days: 30
