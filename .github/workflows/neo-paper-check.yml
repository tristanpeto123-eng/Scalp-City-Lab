name: Neo + continual learner + DEMO PAPER — independent Checker
on:
  pull_request:
    branches: [main]
    paths:
      - 'neo/**'
      - 'neo-lab.html'
      - 'paper_sandbox/**'
      - 'rl/model_registry.py'
      - 'rl/test_model_registry.py'
      - '.github/workflows/neo-pattern-memory.yml'
      - '.github/workflows/demo-paper-pilot.yml'
      - '.github/workflows/pin-demo-candidate.yml'
      - '.github/workflows/robot-dqn-replay.yml'
      - '.github/workflows/neo-paper-check.yml'
      - 'scripts/neo-paper-ui-tests.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker-g0-g1:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: rl-5m-data
          path: rl-5m-data
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checker G0 — no browser order or LIVE API endpoint, correct workflows
        run: |
          python -m compileall -q neo paper_sandbox rl/model_registry.py
          node --test scripts/neo-paper-ui-tests.mjs
          python - <<'PY'
          from pathlib import Path
          runner=Path('paper_sandbox/paper_executor.py').read_text()
          wf=Path('.github/workflows/demo-paper-pilot.yml').read_text()
          if ("PAPER='https://paper-api.alpaca.markets'" not in runner or
              "DATA='https://data.alpaca.markets'" not in runner or
              "https://api.alpaca.markets" in runner or
              "SCALP_DEMO_PAPER_ACCOUNT_ID" not in runner or
              "SCALP_DEMO_MODEL_SHA256" not in runner or
              "SCALP_DEMO_PAPER_ENABLED" not in runner or
              "vars.SCALP_DEMO_PAPER_ENABLED == 'YES_DEMO_ONLY'" not in wf or
              "on:" not in wf):
              raise SystemExit('G0: paper-only endpoint, hash, identity or opt-in gate failed')
          print('G0: demo-money only; no anonymous broker writes')
          PY
      - name: Install numerical and actual DQN inference dependencies
        run: python -m pip install numpy 'torch>=2.3,<3'
      - name: Checker G1 — source-causal NEO memory, frozen weight isolation and paper-order mocks
        run: |
          python -m unittest neo.test_pattern_memory rl.test_model_registry paper_sandbox.test_paper_executor -v
          python -m unittest rl.test_dqn_experiment rl.test_rapid_replay rl.test_five_min_replay -v
      - name: Checker G1 — ingest ten authentic archived five-minute markets twice
        run: |
          python -m neo.pattern_memory --data-dir rl-5m-data/snapshots --root /tmp/neo-review/patterns
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('/tmp/neo-review/patterns/latest.json')
          state=json.loads(path.read_text())
          if (state['symbols']!=10 or state['memorizedLabeledPatterns']<1000 or
              state['finalHoldoutTouched'] or state['paperOrders'] or
              len(state['predictionsOnEligibleTrainingHistory'])!=10):
              raise SystemExit('NEO REAL DATA CHECK FAILED')
          print('NEO_REAL_TEN_CHART_MEMORY '+str(state['memorizedLabeledPatterns']))
          PY
          python -m neo.pattern_memory --data-dir rl-5m-data/snapshots --root /tmp/neo-review/patterns
          python - <<'PY'
          import json,pathlib
          state=json.loads(pathlib.Path('/tmp/neo-review/patterns/latest.json').read_text())
          if state['newPatternsThisRun']!=0:raise SystemExit('NEO duplicate memory ingestion')
          print('NEO_DEDUP_OK')
          PY
      - name: Checker G1 — NEO production module cannot access PAPER secrets or order API
        run: |
          python - <<'PY'
          from pathlib import Path
          neo=Path('neo/pattern_memory.py').read_text()
          memory=Path('.github/workflows/neo-pattern-memory.yml').read_text()
          pin=Path('.github/workflows/pin-demo-candidate.yml').read_text()
          registry=Path('rl/model_registry.py').read_text()
          assert 'futureLogReturn' in neo and 'initialDevelopmentStart' in neo
          assert "original['finalHoldoutObserved']=False" in neo
          assert 'rl-5m-data' in memory and 'neo-learning-memory' in memory
          for blob in (neo,memory,registry,pin):
              assert 'paper-api.alpaca.markets' not in blob
              assert '/v2/orders' not in blob
          assert "tradingFloorAdmitted':False" in registry
          print('G1: NEO memory isolated; trading-floor admission impossible via research code')
          PY
