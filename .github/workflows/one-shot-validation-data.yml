name: Snapshot crypto validation data (read only)
on:
  push:
    branches: [release/strategy-validation-static-v1]
    paths: [validation-data/generate.trigger]
permissions:
  contents: write
concurrency:
  group: strategy-validation-snapshot
  cancel-in-progress: false
jobs:
  package-historical-bars:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static validator and historical GET-only packager
        run: |
          node --check strategy-validation-core.mjs
          node --check tools/build-validation-snapshots.mjs
      - name: Download completed 15-minute bars into bundled JSON for each pair
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node tools/build-validation-snapshots.mjs
      - name: Commit data snapshots to this isolated release branch only
        run: |
          git config user.name "scalp-validation-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "data: prepackage 60-day real crypto OHLCV snapshots for 10 pairs"
          git push origin HEAD:release/strategy-validation-static-v1
