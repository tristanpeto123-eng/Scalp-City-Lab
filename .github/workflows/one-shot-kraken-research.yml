name: One-time Kraken-US crypto feed research (NO ORDERS)
on:
  push:
    branches: [feat/crypto-paper-agents-rc3]
    paths: [paper-runtime/kraken-research.trigger]
permissions:
  contents: read
jobs:
  validate-alternative-crypto-feed:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '63169df6cf003e49e74189c12d73c89b39a980be'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify eight-market read-only feed tests
        run: node paper-runtime/screen-crypto-markets-tests.mjs
      - name: Evaluate Kraken US trade-backed history for eight crypto markets
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          SCALP_RESEARCH_FEED: us-1
          SCALP_RESEARCH_DAYS: '90'
          SCALP_RESEARCH_OUTPUT: research-output/kraken-us-other-crypto.json
        run: node paper-runtime/screen-crypto-markets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kraken-us-alternative-crypto-report
          path: research-output/kraken-us-other-crypto.json
          if-no-files-found: ignore
          retention-days: 30
