name: Academy - Offline Neural Teacher (unverified research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'academy/**'
      - 'scripts/train-academy.mjs'
      - '.github/workflows/academy-teacher-training.yml'
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - 'scripts/train-academy.mjs'
      - 'academy-data/XAUUSD-5m.csv'
  schedule:
    - cron: '37 6 * * *'
permissions:
  contents: read
concurrency:
  group: academy-teacher-offline
  cancel-in-progress: false
jobs:
  neural-teacher:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker - causal Discovery and neural Teacher tests
        run: |
          node --test academy/opportunity-discovery-tests.mjs academy/teacher-training-tests.mjs
          node --check scripts/discover-academy.mjs
          node --check scripts/train-academy.mjs
      - name: Check deliberately supplied XAUUSD history
        id: source
        shell: bash
        run: |
          if [ -s academy-data/XAUUSD-5m.csv ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NO_SOURCE_DATA: no autonomous training or invented progression" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate causal historical opportunities
        if: steps.source.outputs.ready == 'true'
        run: node scripts/discover-academy.mjs academy-data/XAUUSD-5m.csv /tmp/xau-discovery.json
      - name: Train and freeze offline neural checkpoint
        if: steps.source.outputs.ready == 'true'
        run: |
          node scripts/train-academy.mjs /tmp/xau-discovery.json /tmp/academy-research
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync} from 'node:fs';
          const dir='/tmp/academy-research';
          const f=readdirSync(dir).find(x=>x.startsWith('academy-report-'));
          const r=JSON.parse(readFileSync(dir+'/'+f,'utf8'));
          if(r.schema!=='ACADEMY_TEACHER_RESEARCH_V1'||r.paperOrders!==0||r.liveOrders!==0||
             r.verifiedForwardGrades!==0||r.automaticPromotion!==false||
             r.independentFinalTestEvaluated!==false)throw Error('Checker: broker/holdout contract failed');
          console.log('CHECKER: only unverified research and development; no broker orders');
          NODE
      - name: Publish temporary unverified diagnostics only
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: academy-teacher-development-unverified
          path: /tmp/academy-research/academy-report-*.json
          retention-days: 7
