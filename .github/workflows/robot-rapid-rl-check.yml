name: Robot Academy — native 5m DQN causal replay Checker
on:
  pull_request:
    branches: [main]
    paths:
      - 'rl/**'
      - 'scripts/rl-profit-monitor-tests.mjs'
      - 'scripts/refresh-rl-5m*'
      - 'scripts/market-replay-5m-tests.mjs'
      - '.github/workflows/robot-rapid-rl-check.yml'
      - '.github/workflows/robot-dqn-replay.yml'
      - '.github/workflows/refresh-rl-5m.yml'
      - 'market-replay-5m.html'
      - 'training-monitor.html'
      - 'mission-control.html'
      - 'robot-academy.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-minute-checker:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checker G0 — strictly sourced 5m feed, no broker orders, causal browser
        run: |
          node --check scripts/refresh-rl-5m.mjs
          node --test scripts/refresh-rl-5m-tests.mjs
          node --test scripts/market-replay-5m-tests.mjs
          node --test scripts/training-monitor-tests.mjs
          node --test scripts/rl-profit-monitor-tests.mjs
          python -m compileall -q rl
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/robot-dqn-replay.yml').read_text()
          refresh=Path('.github/workflows/refresh-rl-5m.yml').read_text()
          engine=Path('rl/rapid_replay.py').read_text()
          viewer=Path('market-replay-5m.html').read_text()
          if (not all(s in workflow for s in
              ('ref: rl-5m-data','ref: rl-learning-memory',
               'rl-5m-data/snapshots','rl-rapid/replays/')) or
              "ALPACA_PAPER_SECRET" in workflow or
              'scripts/refresh-rl-5m.mjs' not in refresh or
              "validation-data" in workflow or
              "paper-api.alpaca.markets" in engine or
              "/v2/orders" in viewer):
              raise SystemExit('Checker G0: wrong timeframe/source or unsafe broker access')
          print('G0: five-minute completed history, historical-only actions')
          PY
      - name: Install offline DQN dependencies (no brokerage)
        run: python -m pip install numpy 'torch>=2.3,<3'
      - name: Checker G1 — DQN gradients, checkpoint lineage, genuine causal trace
        run: |
          python -m unittest rl.test_dqn_experiment rl.test_rapid_replay rl.test_five_min_replay rl.test_profit_objective -v
      - name: Checker G1 — source history separation and holdout protection
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('rl/rapid_replay.py').read_text()
          policy=Path('rl/dqn_experiment.py').read_text()
          if ("data.get('timeframe')!='5Min'" not in engine or
              "FIVE_MIN_MS = 300_000" not in policy or
              "heldOutQuarantineTouched':False" not in policy or
              "decisionsAreNotBrokerTrades':True" not in engine or
              "marketBarTimeframe':'5Min'" not in engine or
              "paperOrders':0" not in engine or
              "liveOrders':0" not in engine):
              raise SystemExit('Checker G1: five-minute only or release safety invariant missing')
          from rl.profit_objective import OBJECTIVE_ID
          assert OBJECTIVE_ID=='MAXIMISE_NET_PROFIT_AFTER_FEES_AND_SLIPPAGE_V1'
          if ("'profitObjective':profit_objective" not in policy or
              "'profitGoalPassingPupils'" not in engine):
              raise SystemExit('Checker G1: missing after-fee profit audit')
          print('G1: net profit objective verified, later validation separate, final 20% untouched')
          PY
