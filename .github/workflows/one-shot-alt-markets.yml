name: One-time eight-market historical crypto research (NO ORDERS)
on:
  push:
    branches: [feat/crypto-paper-agents-rc3]
    paths: [paper-runtime/alt-market-screen.trigger]
permissions:
  contents: read
jobs:
  crypto-research:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '998cee3a1cedc73ef86f7fe1b9de5d32190bc676'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check research-only code and broker permission tests
        run: |
          node --check paper-runtime/screen-crypto-markets.mjs
          node paper-runtime/screen-crypto-markets-tests.mjs
      - name: Inspect eight active assets and perform ninety-day data-only evaluation
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          SCALP_RESEARCH_DAYS: '90'
          SCALP_RESEARCH_OUTPUT: research-output/other-crypto-markets.json
        run: node paper-runtime/screen-crypto-markets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: other-crypto-markets-read-only-report
          path: research-output/other-crypto-markets.json
          if-no-files-found: ignore
          retention-days: 30
