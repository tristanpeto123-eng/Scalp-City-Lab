name: Scalp City — repeated parent-seeded chart research lessons
on:
  schedule:
    - cron: '5 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - robot-training.trigger
permissions:
  contents: write
concurrency:
  group: scalp-robot-research-trainer
  cancel-in-progress: false
jobs:
  train-research-and-publish:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker — verify strategy research, isolation and read-only behavior
        run: |
          node --check scripts/run-robot-training.mjs
          node --test scripts/run-robot-training-tests.mjs
          node --test scripts/export-robot-academy-tests.mjs
          node --test strategy-adaptive-model-tests.mjs
          node --test robot-academy-tests.mjs
      - name: Run one research generation on each saved crypto chart (NO orders)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-robot-training.mjs
      - name: Checkout updated standalone research memory after successful write
        uses: actions/checkout@v4
        with:
          ref: scalp-learning-memory
          path: research-memory
          persist-credentials: false
      - name: Convert stored training results to safe Academy pupil snapshot
        run: |
          node scripts/export-robot-academy.mjs \
            research-memory/scalp-learning/history.json \
            research-data/robot-academy.json
          node -e 'const r=require("./research-data/robot-academy.json");if(r.pupils.length!==10||r.actualBrokerOrders!==0||r.verifiedForwardGrades!==0||r.pupils.some(x=>x.confirmedForward||x.championModel!==null))process.exit(1);console.log("CHECKER: 10 chart pupils; zero live orders, independently verified grades or deployed champions")'
      - name: Publish a new Academy school snapshot only when research has changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research-data/robot-academy.json
          if git diff --cached --quiet; then
            echo 'No new model-memory experiments, no Academy publication necessary'
          else
            git commit -m 'research: publish automatically learned training-only Robot Academy lessons'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
