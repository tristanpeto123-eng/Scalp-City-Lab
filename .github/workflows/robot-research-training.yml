name: Scalp City — repeated parent-seeded chart research lessons
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *' # best-effort every 5 minutes UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - robot-training.trigger
permissions:
  contents: write
concurrency:
  group: scalp-robot-research-trainer
  cancel-in-progress: false
jobs:
  train-research-and-publish:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker — verify strategy research, isolation and read-only behavior
        run: |
          node --check scripts/run-robot-training.mjs
          node --test scripts/run-robot-training-tests.mjs
          node --test scripts/historical-training-folds-tests.mjs
          node --test scripts/robot-rewards-tests.mjs
          node --test scripts/build-training-monitor-tests.mjs
          node --test scripts/refresh-alpaca-snapshots-tests.mjs
          node --test scripts/export-robot-academy-tests.mjs
          node --test strategy-adaptive-model-tests.mjs
          node --test robot-academy-tests.mjs
          node --check scripts/historical-lab.mjs
          node --test scripts/historical-lab-tests.mjs
      # Historical lab is decoupled from the six-hour GET-only snapshot refresh.
      # Never contact a broker or use PAPER account keys in routine development.
      - name: Validate ten locally versioned historical datasets (no broker network)
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {PAIRS,checkSnapshot} from './strategy-validation-core.mjs';
          let oldest=Infinity;
          for(const symbol of PAIRS){
            const d=JSON.parse(await readFile('validation-data/'+symbol.replace('/','-')+'.json','utf8'));
            const checked=checkSnapshot(d,symbol);
            if(checked.bars.length<2400)throw Error('Insufficient historical research window for '+symbol);
            oldest=Math.min(oldest,Date.parse(d.generatedAt||0));
            console.log('HISTORICAL_VALIDATED '+symbol+' '+checked.bars.length+' candles');
          }
          if(Date.now()-oldest>14*86400_000)
            throw Error('Archived datasets over 14 days old; refresh from provider before reuse');
          console.log('PUBLISHED_HISTORY_ONLY=true; PAPER_ORDERS=0');
          NODE
      - name: Run one research generation per crypto chart (NO orders)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCALP_RESEARCH_INPUT_DIR: validation-data
        run: node scripts/run-robot-training.mjs
      - name: Checkout updated standalone research memory after successful write
        uses: actions/checkout@v4
        with:
          ref: scalp-learning-memory
          path: research-memory
          persist-credentials: false
      - name: Run offline historical rolling-fold development lab (holdout untouched)
        run: |
          node scripts/historical-lab.mjs \
            research-memory/scalp-learning/history.json \
            validation-data \
            research-data/historical-lab-latest.json
          node -e 'const r=require("./research-data/historical-lab-latest.json");if(r.tenPupils!==10||r.admissionCount||r.brokerOrders||r.verifiedForwardGrades||!r.quarantinedHoldoutNotScored)process.exit(1)'
      - name: Convert stored training results to safe Academy pupil snapshot
        run: |
          node scripts/export-robot-academy.mjs \
            research-memory/scalp-learning/history.json \
            research-data/robot-academy.json
          node -e 'const r=require("./research-data/robot-academy.json");if(r.pupils.length!==10||r.actualBrokerOrders!==0||r.verifiedForwardGrades!==0||r.pupils.some(x=>x.confirmedForward||x.championModel!==null))process.exit(1);console.log("CHECKER: 10 chart pupils; zero live orders, independently verified grades or deployed champions")'
      - name: Generate read-only measured training and development OOS monitor
        run: node scripts/build-training-monitor.mjs
      - name: Publish a new Academy school snapshot only when research has changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research-data/robot-academy.json research-data/historical-lab-latest.json research-data/training-monitor.json
          if git diff --cached --quiet; then
            echo 'No new model-memory experiments, no Academy publication necessary'
          else
            git commit -m 'research: publish automatically learned training-only Robot Academy lessons'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
