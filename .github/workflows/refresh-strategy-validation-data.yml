name: Scalp City Validation - Refresh Alpaca Candles
on:
  push:
    branches: [release/strategy-validation-static-v1]
    paths:
      - paper-runtime/export-validation-candles.mjs
      - .github/workflows/refresh-strategy-validation-data.yml
  workflow_dispatch:
  schedule:
    - cron: '18 3 * * *'
permissions:
  contents: write
concurrency:
  group: scalp-city-public-alpaca-candle-snapshots
  cancel-in-progress: false
jobs:
  read-only-historical-snapshots:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local browser calculation and source safety
        run: |
          node --check strategy-validation-core.mjs
          node --check paper-runtime/export-validation-candles.mjs
          node --test strategy-validation-tests.mjs
      - name: Fetch and validate completed Alpaca 15-minute candles (no broker orders)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          SCALP_SNAPSHOT_DAYS: '60'
        run: node paper-runtime/export-validation-candles.mjs
      - name: Verify generated datasets and browser replay after refresh
        run: node --test strategy-validation-tests.mjs
      - name: Commit only approved public historical market data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation-data/
          if git diff --cached --quiet; then
            echo 'No changes to published candle snapshots'
          else
            git commit -m 'data: refresh public historical Alpaca crypto validation candles'
            git push
          fi
