name: Academy - Price Level Intelligence Offline Checker
on:
  pull_request:
    paths:
      - 'academy/price-level-intelligence.mjs'
      - 'academy/price-level-intelligence-tests.mjs'
      - 'academy/PRICE-LEVEL-INTELLIGENCE.md'
      - 'academy/student-skill-contract.mjs'
      - 'scripts/research-price-levels.mjs'
      - '.github/workflows/academy-price-level-intelligence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pli-research-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure syntax and run offline, synthetic fixture checks
        run: |
          node --check academy/price-level-intelligence.mjs
          node --check scripts/research-price-levels.mjs
          node --test academy/price-level-intelligence-tests.mjs academy/student-skill-contract-tests.mjs
      - name: Prove broker credentials are not present in PLI source
        run: |
          if grep -Ei '(process\.env\.(BROKER|OANDA|ALPACA)|placeOrder\(|createOrder\()' academy/price-level-intelligence.mjs; then exit 1; fi
          echo 'PLI_OFFLINE_ONLY: no data published, no broker orders, no promotion'