name: Render private PAPER commissioning — Blueprint security Checker
on:
  pull_request:
    paths:
      - 'render.yaml'
      - 'docs/RENDER-PRIVATE-PAPER-COMMISSION.md'
      - '.github/workflows/render-private-paper-check.yml'
      - 'paper_sandbox/Dockerfile.commission'
      - 'paper_sandbox/railway_commission.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-private-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser for actual Blueprint validation
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Checker G0 — private, one instance, durable volume, no deploy automation
        run: |
          python - <<'PY'
          import pathlib,yaml
          bp=yaml.safe_load(pathlib.Path('render.yaml').read_text())
          if not isinstance(bp,dict) or set(bp)!={'services'} or len(bp['services'])!=1:
              raise SystemExit('RENDER_CHECKER: only one explicit private service permitted')
          s=bp['services'][0]
          expect={
              'type':'pserv','runtime':'docker','region':'frankfurt',
              'plan':'0.5c-512mb','numInstances':1,'autoDeployTrigger':'off',
              'dockerfilePath':'./paper_sandbox/Dockerfile.commission',
              'dockerContext':'.',
          }
          for key,value in expect.items():
              if s.get(key)!=value: raise SystemExit('RENDER_CHECKER: forbidden '+key)
          if s.get('disk')!={'name':'scalp-paper-readonly-journal',
              'mountPath':'/data','sizeGB':1}:
              raise SystemExit('RENDER_CHECKER: private persistent disk missing')
          if {v['key']:v.get('value') for v in s.get('envVars',[])}!={               'SCALP_READ_ONLY_ACCOUNT_PREFLIGHT':'NO','PORT':'8080'}:
              raise SystemExit('RENDER_CHECKER: credentials or unsafe activation')
          source=pathlib.Path('paper_sandbox/Dockerfile.commission').read_text()
          if ('COPY paper_sandbox /app' in source or
              'COPY paper_sandbox/railway_commission.py' not in source or
              'COPY paper_sandbox/__init__.py' not in source or
              'paper_executor.py' in source or 'shared_runtime.py' in source):
              raise SystemExit('RENDER_CHECKER: executable broker writer in image')
          print('RENDER_PRIVATE_PAPER_BLUEPRINT_STATIC_SECURITY_PASS')
          PY
      - name: Checker G1 — mocked broker GET-only and durable canary tests
        run: |
          python -m unittest paper_sandbox.test_railway_commission -v
          python -m compileall -q paper_sandbox/railway_commission.py
      - name: Checker G1 — build and boot exact Render Docker image
        run: |
          set -euo pipefail
          docker build -f paper_sandbox/Dockerfile.commission -t scalp-render-paper-commission:test .
          mkdir -p "$RUNNER_TEMP/render-paper-test"
          chmod 700 "$RUNNER_TEMP/render-paper-test"
          docker run -d --name scalp-render-paper-test \
            -p 127.0.0.1:18081:8080 \
            -e SCALP_READ_ONLY_ACCOUNT_PREFLIGHT=NO \
            -v "$RUNNER_TEMP/render-paper-test:/data" \
            scalp-render-paper-commission:test
          trap 'docker rm -f scalp-render-paper-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -sSf http://127.0.0.1:18081/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'health.json').read_text())
          if (r.get('storageReady') is not True or r.get('writerEnabled') is not False
              or r.get('paperOrdersSubmitted') != 0 or r.get('liveOrdersSubmitted') != 0
              or r.get('mode') != 'READ_ONLY_COMMISSIONING'
              or r.get('account',{}).get('status') != 'GET_ONLY_PREFLIGHT_NOT_REQUESTED'):
              raise SystemExit('RENDER_CHECKER: unsafe runtime readiness')
          print('RENDER_READ_ONLY_RUNTIME_PASS')
          PY
          docker stop scalp-render-paper-test >/dev/null
          docker start scalp-render-paper-test >/dev/null
          for i in $(seq 1 20); do
            if curl -sSf http://127.0.0.1:18081/health > "$RUNNER_TEMP/health-after-restart.json"; then break; fi
            sleep 1
          done
          cmp "$RUNNER_TEMP/health.json" "$RUNNER_TEMP/health-after-restart.json"
          docker exec scalp-render-paper-test python -c \
            'from pathlib import Path; assert Path("/data/scalp-paper/read-only-host-ready").read_bytes().startswith(b"PAPER_READ_ONLY_HOST_V1")'
          echo 'RENDER_COLD_START_RESTART_DURABLE_CANARY_PASS'
