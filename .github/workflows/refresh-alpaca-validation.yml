name: Refresh public crypto validation snapshots (Alpaca GET only)
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - alpaca-snapshot-refresh.trigger
permissions:
  contents: write
concurrency:
  group: scalp-city-validation-snapshots
  cancel-in-progress: false
jobs:
  snapshot-refresh:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker - data fetcher and virtual strategy tests (offline)
        run: |
          node --check scripts/refresh-alpaca-snapshots.mjs
          node --test scripts/refresh-alpaca-snapshots-tests.mjs
          node --test strategy-validation-tests.mjs
      - name: GET only - refresh all ten Alpaca/Kraken 15-minute history snapshots
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node scripts/refresh-alpaca-snapshots.mjs
      - name: Commit validated snapshots only when refreshed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- validation-data/
          if git diff --cached --quiet; then
            echo 'Alpaca history unchanged'
          else
            git commit -m 'data: refresh read-only Alpaca Kraken-US validation candles'
            git push origin HEAD:main
          fi
