# One-time read-only paper crypto eligibility + 24/7 feed verification.
name: One-time Alpaca crypto feed check
on:
  push:
    branches:
      - feat/connected-live-paper-agents
    paths:
      - paper-runtime/crypto-preflight.trigger
permissions:
  contents: read
jobs:
  check-crypto:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '298484a359e871ae515598b095c4f0a3bf79c6f0'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check crypto preflight source syntax
        run: node --check paper-runtime/crypto-preflight.mjs
      - name: Read-only crypto checks with paper credentials
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node paper-runtime/crypto-preflight.mjs
