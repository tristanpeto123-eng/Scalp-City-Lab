name: Scalp City independent chart-model research learning
on:
  workflow_dispatch:
    inputs:
      feed:
        type: choice
        description: "Data source; historical research only"
        options: [us-1, us]
        required: true
        default: us-1
      days:
        type: choice
        description: "Historical window; remains train-only for model updates"
        options: ['30', '90', '180']
        default: '90'
        required: true
permissions:
  contents: write
concurrency:
  group: scalp-pair-learning-memory
  cancel-in-progress: false
jobs:
  learn-chart-by-chart:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hard safety/checker gate — no simulated learned evidence
        run: |
          node paper-runtime/tests.mjs
          node paper-runtime/crypto-tests.mjs
          node paper-runtime/chart-models-tests.mjs
          node paper-runtime/deposit-goal-planner-tests.mjs
      - name: Read 10 crypto markets and append independently accepted chart-model evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          SCALP_RESEARCH_FEED: ${{ inputs.feed }}
          SCALP_RESEARCH_DAYS: ${{ inputs.days }}
        run: node paper-runtime/learning-run.mjs
