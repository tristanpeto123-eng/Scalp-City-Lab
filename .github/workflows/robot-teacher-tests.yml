name: Robot Academy Teacher — mock-only Checker
on:
  pull_request:
    paths:
      - 'teacher/**'
      - 'trading-floor.html'
      - 'robot-academy.html'
      - 'teacher-console.html'
      - 'index.html'
      - 'agent-city.html'
      - '.github/workflows/robot-teacher-tests.yml'
  push:
    paths:
      - 'teacher/**'
      - 'trading-floor.html'
      - 'robot-academy.html'
      - 'teacher-console.html'
      - 'index.html'
      - 'agent-city.html'
      - '.github/workflows/robot-teacher-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker-teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks — no broker credentials supplied
        run: |
          node --check teacher/engine.mjs
          node --check teacher/alpaca-crypto.mjs
          node --check teacher/runtime.mjs
          node --check teacher/teacher-tests.mjs
          node --check teacher/teacher-v2-tests.mjs
          node --check teacher/teacher-console-tests.mjs
          node --check teacher/public-client.mjs
          node --check teacher/public-client-tests.mjs
          node --check teacher/grade-service-tests.mjs
          node --check teacher/auditor.mjs
          node --check teacher/admission-seal.mjs
          node --check teacher/evidence.mjs
          node --check teacher/fx-reference.mjs
          node --check teacher/risk-ledger.mjs
          node --check teacher/grade-pipeline.mjs
          node --check teacher/grade-service.mjs
          node --check teacher/paper-preflight.mjs
          node --check teacher/admit.mjs
      - name: Unit and adversarial mock-only tests
        env:
          TEACHER_PAPER_ENABLED: 'false'
        run: node --test teacher/teacher-tests.mjs teacher/teacher-v2-tests.mjs teacher/teacher-console-tests.mjs teacher/public-client-tests.mjs teacher/grade-service-tests.mjs
