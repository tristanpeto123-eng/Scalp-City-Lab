name: Scalp City Alpaca secret diagnosis (GET only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/teacher-data-access-diagnose-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare PAPER account and historical data permissions (safe HTTP status only)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.ALPACA_PAPER_KEY||'';
          const secret=process.env.ALPACA_PAPER_SECRET||'';
          console.log('PAPER_KEY_CONFIGURED='+Boolean(key));
          console.log('PAPER_SECRET_CONFIGURED='+Boolean(secret));
          if(!key||!secret){console.log('DIAGNOSIS=MISSING_ACTIONS_SECRET');process.exit(0)}
          const headers={'APCA-API-KEY-ID':key,'APCA-API-SECRET-KEY':secret,Accept:'application/json'};
          const now=Date.now();
          const params=new URLSearchParams({symbols:'BTC/USD',timeframe:'15Min',
            start:new Date(now-86400000).toISOString(),
            end:new Date(now-900000).toISOString(),limit:'50'});
          for(const [name,url] of [
             ['PAPER_ACCOUNT','https://paper-api.alpaca.markets/v2/account'],
             ['CRYPTO_MARKET_DATA','https://data.alpaca.markets/v1beta3/crypto/us-1/bars?'+params]
          ]){
             try{
               const response=await fetch(url,{method:'GET',headers,redirect:'error',
                 signal:AbortSignal.timeout(12000)});
               console.log(name+'_HTTP='+response.status);
             }catch(error){console.log(name+'_NETWORK_FAILURE='+error.name)}
          }
          console.log('PAPER_ORDER_CALLS=0');
          NODE
