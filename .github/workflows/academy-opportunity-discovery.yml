name: Academy - XAUUSD offline opportunity discovery (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'academy/**'
      - 'scripts/discover-academy.mjs'
      - '.github/workflows/academy-opportunity-discovery.yml'
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'academy/**'
      - 'scripts/discover-academy.mjs'
      - 'academy-data/XAUUSD-5m.csv'
      - '.github/workflows/academy-opportunity-discovery.yml'
permissions:
  contents: read
concurrency:
  group: academy-xau-offline
  cancel-in-progress: false
jobs:
  discovery:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker - validate causal and no-broker engine
        run: node --test academy/opportunity-discovery-tests.mjs
      - name: Detect user supplied XAUUSD candle history
        id: source
        shell: bash
        run: |
          if [ -s academy-data/XAUUSD-5m.csv ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "NO_SOURCE_DATA - no simulation or synthetic substitution" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build offline research labels only
        if: steps.source.outputs.ready == 'true'
        run: |
          node scripts/discover-academy.mjs academy-data/XAUUSD-5m.csv /tmp/xau-research.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('/tmp/xau-research.json','utf8'));
          if(r.schema!=='ACADEMY_OPPORTUNITY_DISCOVERY_V1' ||
             r.brokerOrders!==0 || r.modelPromotions!==0 || r.verifiedForwardGrades!==0 ||
             r.dataset.sealedTestEvaluated!==false ||
             r.opportunities.some(o=>Date.parse(o.closedAt)>=Date.parse(r.dataset.sealedTestStart)))
            throw Error('CHECKER: execution or holdout integrity failed');
          console.log('CHECKER PASS: research only, no broker orders');
          NODE
      - name: Upload temporary unverified labels
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xau-unverified-discovery
          path: /tmp/xau-research.json
          retention-days: 7
