name: Teacher live HTTPS gateway verification (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teacher-https-commission-probe.yml'
permissions:
  contents: read
jobs:
  verify-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect real Railway HTTPS status and pinned public settings
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const settings=JSON.parse(await readFile('teacher/public-settings.json','utf8'));
          assert.equal(settings.status,'CONFIGURED');
          const base=new URL(settings.feedUrl);
          assert.equal(base.protocol,'https:');
          const publicSettings=await fetch('https://tristanpeto123-eng.github.io/Scalp-City-Lab/teacher/public-settings.json',{cache:'no-store'});
          assert.equal(publicSettings.status,200,'Pages did not publish signed feed settings');
          const page=await publicSettings.json();
          assert.equal(page.signingPublicKeyBase64,settings.signingPublicKeyBase64);
          assert.equal(page.feedUrl,settings.feedUrl);
          const conn=await fetch(settings.connectionUrl,{cache:'no-store'});
          assert.equal(conn.status,200,'Private/gateway handshake unavailable');
          assert.equal(conn.headers.get('Access-Control-Allow-Origin'),'https://tristanpeto123-eng.github.io');
          const status=await conn.json();
          assert.equal(status.schema,'TEACHER_PUBLIC_CONNECTION_V1');
          assert.equal(status.signerPinned,true);
          assert.equal(status.privateExaminerLinked,true);
          assert.equal(status.examinerStatus,'NOT_ADMITTED');
          assert.equal(status.paperOrdersEnabled,false);
          const health=await fetch(new URL('/health',settings.feedUrl));
          assert.equal(health.status,200);
          const signedReport=await fetch(settings.feedUrl,{cache:'no-store'});
          assert.equal(signedReport.status,503,'Unverified broker results must fail closed');
          const closed=await signedReport.json();
          assert.equal(closed.verifiedPaperGrades,0);
          assert.equal(closed.paperOrdersEnabled,false);
          console.log('HTTPS_GATEWAY=VERIFIED');
          console.log('PRIVATE_EXAMINER=LINKED');
          console.log('PINNED_SIGNER=VERIFIED');
          console.log('PUBLIC_PAGES_CONFIG=MATCHED');
          console.log('BROKER_EXAM=NOT_ADMITTED');
          console.log('PAPER_ORDERS=DISABLED');
          console.log('UNSIGNED_GRADE_FEED=DENIED');
          NODE
