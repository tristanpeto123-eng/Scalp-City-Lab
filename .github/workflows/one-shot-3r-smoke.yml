name: One-shot approved 3R agent research smoke test
on:
  push:
    branches: [feat/crypto-paper-agents-rc3]
    paths: [paper-runtime/research-3r-smoke.trigger]
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '823cf3535392993327f9e4a9e85a879af63919be'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck read-only 3R research code
        run: |
          node --check paper-runtime/learning-3r.mjs
          node paper-runtime/learning-3r-tests.mjs
      - name: Run connected live crypto agent research (no broker order path)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node paper-runtime/once.mjs
