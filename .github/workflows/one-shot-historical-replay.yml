name: One-off GBP8000 profit historical replay
on:
  push:
    branches: [feat/crypto-paper-agents-rc3]
    paths: [paper-runtime/historical-replay.trigger]
permissions:
  contents: read
jobs:
  replay:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0e3cc307f6db4118016bee1d55d77926e1877163'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify replay tests and API GET-only module syntax
        run: |
          node paper-runtime/profit-goal-tests.mjs
          node --check paper-runtime/replay-run.mjs
      - name: Run 180-day BTC and ETH initial training then chronological frozen evaluation
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          SCALP_REPLAY_DAYS: "180"
          SCALP_REPLAY_OUTPUT: replay-output/report.json
        run: node paper-runtime/replay-run.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: historical-profit8000-replay-report
          path: replay-output/report.json
          retention-days: 30
