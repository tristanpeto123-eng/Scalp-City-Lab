name: Alpaca crypto paper and live-data check (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-crypto:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only crypto preflight
        run: node --check paper-runtime/crypto-preflight.mjs
      - name: Verify paper crypto asset availability and 24x7 candles (GET only)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node paper-runtime/crypto-preflight.mjs
