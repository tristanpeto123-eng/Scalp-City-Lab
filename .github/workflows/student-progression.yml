name: Student Observatory — publish audited progress
on:
  workflow_dispatch:
  schedule:
    - cron: '22 * * * *'  # hourly best-effort; no claims of continuous server uptime
  push:
    branches: [main]
    paths:
      - 'research-data/robot-academy.json'
      - 'research-data/training-monitor.json'
      - 'scripts/build-student-progress.mjs'
      - 'scripts/build-student-progress-tests.mjs'
      - '.github/workflows/student-progression.yml'
permissions:
  contents: write
concurrency:
  group: scalp-student-progress-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read published Academy records from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Read separate neural checkpoint results — no model weights published
        uses: actions/checkout@v4
        with:
          ref: rl-learning-memory
          path: rl-history
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checker — audited source and no-broker claims
        run: |
          node --check scripts/build-student-progress.mjs
          node --test scripts/build-student-progress-tests.mjs
      - name: Build per-student evidence and append unique DQN checkpoints
        run: |
          node scripts/build-student-progress.mjs \
            research-data/robot-academy.json \
            research-data/training-monitor.json \
            rl-history/rl-rapid/latest.json \
            research-data/student-progression.json
      - name: Fail-closed public output audit
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const r=JSON.parse(await readFile('research-data/student-progression.json','utf8'));
          if(r.schema!=='SCALP_STUDENT_PROGRESS_V1'||
             r.students.length!==10||r.summary.realBrokerOrders!==0||
             r.summary.independentlyForwardVerified!==0||
             r.students.some(s=>s.brokerOrders||s.forwardVerified||s.admittedForTrading))
            throw Error('Student Observatory public research policy breach');
          const txt=JSON.stringify(r);
          if(/"weights"|"privateKey"|"apiKey"|"token"|"authorization"/i.test(txt))
            throw Error('Sensitive model material cannot be published');
          console.log('STUDENT_OBSERVATORY: public aggregates only; real training gradients, no broker orders');
          NODE
      - name: Publish only actual changed evidence or a new distinct model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research-data/student-progression.json
          if git diff --cached --quiet; then
            echo 'No new Student Observatory evidence'
          else
            git commit -m 'research: update audited student progress charts from saved model evidence'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
