name: One-time full live-feed research proof, read only
on:
  push:
    branches: [feat/crypto-paper-agents-rc3]
    paths: [paper-runtime/rc3-preflight.trigger]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'd86045e9f59a7c92d7a17fe9d444ba866c6731ad'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no-order research runner syntax and 55 mock tests
        run: |
          node --check paper-runtime/once.mjs
          node paper-runtime/tests.mjs
          node paper-runtime/crypto-tests.mjs
      - name: Run actual five-market read-only research with paper keys
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: node paper-runtime/once.mjs
