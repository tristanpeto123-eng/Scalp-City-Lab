# Owner-operated, read-only. Never activate paper order writes here.
# Uses the existing GitHub Alpaca PAPER credentials only for a single-symbol
# preflight. One account is NOT proof that ten isolated pupils are funded.
name: Teacher crypto paper-account preflight (GET only)
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "One crypto symbol to verify against the existing Alpaca PAPER account"
        type: choice
        required: true
        default: BTC/USD
        options:
          - BTC/USD
          - ETH/USD
          - SOL/USD
          - XRP/USD
          - ADA/USD
          - AVAX/USD
          - LINK/USD
          - DOGE/USD
          - LTC/USD
          - BCH/USD
permissions:
  contents: read
jobs:
  check-teacher-paper:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Teacher preflight has no order mutations
        run: |
          node --check teacher/paper-preflight.mjs
          node --test teacher/teacher-console-tests.mjs
      - name: Inspect existing PAPER account / selected crypto pair
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          TEACHER_CHECK_SYMBOL: ${{ inputs.symbol }}
        run: |
          node --input-type=module <<'NODE'
          import {CryptoTeacherBroker} from './teacher/alpaca-crypto.mjs';
          import {preflightPaper} from './teacher/paper-preflight.mjs';
          const symbol=process.env.TEACHER_CHECK_SYMBOL;
          const key=process.env.ALPACA_PAPER_KEY;
          const secret=process.env.ALPACA_PAPER_SECRET;
          if(!key||!secret)throw Error('PREFLIGHT: private Alpaca PAPER secrets missing');
          const broker=new CryptoTeacherBroker({
            credentials:{[symbol]:{key,secret}},
            fetchImpl:(url,opts)=>{
              if(opts?.method!=='GET'||!url.startsWith('https://paper-api.alpaca.markets/'))
                throw Error('PREFLIGHT: denied all broker writes and non-PAPER hosts');
              return fetch(url,opts);
            }
          });
          const result=await preflightPaper({broker,symbols:[symbol]});
          if(result.accountsChecked!==1)throw Error('PREFLIGHT: incorrect account count');
          console.log(JSON.stringify({
            schema:result.schema,operation:'READ_ONLY_GET',allPassed:result.allPassed,
            rows:result.rows.map(({symbol,passed,reasons,status,cryptoStatus,
              minimumOrderSize,minimumTradeIncrement})=>({symbol,passed,reasons,
                status,cryptoStatus,minimumOrderSize,minimumTradeIncrement})),
            note:'No paper order submitted. A single account does not qualify ten isolated pupils.'
          },null,2));
          if(!result.allPassed)process.exitCode=1;
          NODE
