name: SL real-browser startup and persistence
on:
  pull_request:
    paths:
      - 'sl-strategy.html'
      - 'sl-core.mjs'
      - 'sl-5m.mjs'
      - 'sl-loop.mjs'
      - 'sl-model-vault.mjs'
      - 'sl-hourly-sync.mjs'
      - 'sl-chart-cache.mjs'
      - 'scripts/sl-browser-smoke.mjs'
      - '.github/workflows/sl-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Execute browser UI smoke
        run: node scripts/sl-browser-smoke.mjs
