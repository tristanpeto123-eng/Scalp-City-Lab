name: Teacher — independent model qualification (no orders)
on:
  push:
    branches: [feat/teacher-qualification-review-20261018, main]
    paths:
      - 'teacher/qualification-runner.mjs'
      - 'research-data/robot-academy.json'
      - '.github/workflows/teacher-qualification.yml'
  # Workflow-run events fire after the research job completes, including when
  # its GITHUB_TOKEN wrote new Academy files (push workflows do not self-trigger).
  workflow_run:
    workflows: ["Scalp City — repeated parent-seeded chart research lessons"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 14 * * *'
permissions:
  contents: read
jobs:
  research-admission-screen:
    if: >-
      github.repository == 'tristanpeto123-eng/Scalp-City-Lab' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch append-only independently archived training memory
        uses: actions/checkout@v4
        with:
          ref: scalp-learning-memory
          path: research-memory
          persist-credentials: false
      - name: Checker verifies evaluator source and unit suites (no Alpaca order access)
        env:
          TEACHER_ENABLE_EXAMINER: 'false'
          TEACHER_PAPER_ENABLED: 'false'
        run: |
          node --check teacher/qualification-runner.mjs
          node --check teacher/admit.mjs
          node --check teacher/auditor.mjs
          node --test teacher/teacher-tests.mjs teacher/teacher-v2-tests.mjs teacher/hosted-preflight-tests.mjs
          node --test teacher/qualification-workflow-tests.mjs
      - name: Screen ten published Academy leaders against source-matched untouched chronology
        env:
          TEACHER_ENABLE_EXAMINER: 'false'
          TEACHER_PAPER_ENABLED: 'false'
        run: |
          node teacher/qualification-runner.mjs \
            research-memory/scalp-learning/history.json \
            research-data/robot-academy.json \
            validation-data \
            qualification-results/report.json
      - name: Record independent screening outcome without admitting or trading
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync('qualification-results/report.json','utf8'));
          if(result.pupilsTotal!==10||result.admissionsIssued!==0||result.brokerOrdersSubmitted!==0)
            throw Error('Qualification gate cannot create broker activity or admissions');
          console.log('QUALIFICATION_RESULT='+result.status);
          console.log('QUALIFIED_CANDIDATES='+result.eligibleCount);
          console.log('SLOTS_AVAILABLE='+result.availablePaperSlots);
          for(const p of result.pupils)
            console.log('SCREEN '+p.symbol+' '+p.verdict+' closed='+p.trainingTrades+
              ' net_gbp='+p.trainingNetGbp+' '+p.reasons.join('; ').slice(0,190));
          const summary=['## Independent Robot Academy qualification',
            'Historical research only. No admissions or trades.','',
            '| Pupil | Train closes | Train net GBP | Holdout net GBP | Verdict |',
            '|---|---:|---:|---:|---|',
            ...result.pupils.map(p=>`| ${p.symbol} | ${p.trainingTrades} | ${p.trainingNetGbp} | ${p.holdoutNetGbp??'unverified'} | ${p.verdict} |`),
            '',`**Eligible:** ${result.eligibleCount}/10; **paper seats:** ${result.availablePaperSlots}; **orders:** 0`,''];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: independent-teacher-qualification
          path: qualification-results/report.json
          retention-days: 30

  publish-public-historical-report:
    name: Publish read-only historical verdicts (not a grade)
    needs: research-admission-screen
    if: needs.research-admission-screen.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: scalp-teacher-historical-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read independent job artifact; no recomputation under publishing token
        uses: actions/download-artifact@v4
        with:
          name: independent-teacher-qualification
          path: qualification-results
      - name: Checker G0 — validated historical-only publication
        run: |
          node --check scripts/publish-teacher-screen.mjs
          node --test scripts/publish-teacher-screen-tests.mjs
          node scripts/publish-teacher-screen.mjs qualification-results/report.json research-data/teacher-qualification.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('research-data/teacher-qualification.json','utf8'));
          if(x.pupils.length!==10||x.admissionsIssued!==0||x.brokerOrdersSubmitted!==0||
             x.verifiedForwardGrades!==0||x.trainingOnly!==true)
             throw Error('PUBLICATION_BLOCKED: not a no-orders historical Teacher report');
          NODE
      - name: Publish only the sanitized read-only historical report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research-data/teacher-qualification.json
          if git diff --cached --quiet; then
            echo 'No change to the independently screened historical report'
          else
            git commit -m 'research: publish read-only independent historical Teacher screening'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
