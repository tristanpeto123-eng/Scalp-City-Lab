name: Student Observatory — Checker and Safari browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'student-progress.html'
      - 'student-progress.js'
      - 'research-data/student-progression.json'
      - 'scripts/build-student-progress.mjs'
      - 'scripts/build-student-progress-tests.mjs'
      - 'scripts/student-progress-browser-smoke.mjs'
      - '.github/workflows/student-progression-tests.yml'
  push:
    branches: [main]
    paths:
      - 'student-progress.html'
      - 'student-progress.js'
      - 'scripts/build-student-progress.mjs'
      - '.github/workflows/student-progression-tests.yml'
permissions:
  contents: read
jobs:
  checker:
    if: github.repository == 'tristanpeto123-eng/Scalp-City-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest real DQN checkpoints for integration tests
        uses: actions/checkout@v4
        with:
          ref: rl-learning-memory
          path: rl-history
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source schema and no-trading checks
        run: |
          node --check scripts/build-student-progress.mjs
          node --check student-progress.js
          node --check scripts/student-progress-browser-smoke.mjs
          node --test scripts/build-student-progress-tests.mjs
      - name: Rebuild real progress against published Academy and RL records
        run: |
          node scripts/build-student-progress.mjs \
            research-data/robot-academy.json \
            research-data/training-monitor.json \
            rl-history/rl-rapid/latest.json \
            /tmp/student-progress-evidence.json
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const d=JSON.parse(await readFile('/tmp/student-progress-evidence.json','utf8'));
          if(d.students.length!==10||d.summary.realBrokerOrders||d.summary.independentlyForwardVerified||
            d.students.some(s=>s.rl.checkpoints.length<1||s.brokerOrders||s.forwardVerified))
            throw Error('Real-data research gate failed');
          console.log('REAL STUDENT PROGRESSION SOURCE CHECK: ten crypto models, zero broker orders');
          NODE
      - name: Install browser harness
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium + Safari WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Test real source graph and browser-local SL checkpoints
        run: node scripts/student-progress-browser-smoke.mjs
